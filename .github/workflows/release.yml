name: Release

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      version_label:
        description: Version label to evaluate without publishing
        required: true
        type: choice
        options:
          - version:major
          - version:minor
          - version:patch
          - version:none
      current_version:
        description: Optional current version override for dry-run
        required: false
        type: string
      target_sha:
        description: Optional main commit to evaluate
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

env:
  INITIAL_VERSION: 26.0.0

jobs:
  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      INPUT_CURRENT_VERSION: ${{ inputs.current_version }}
      INPUT_VERSION_LABEL: ${{ inputs.version_label }}
      PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || inputs.target_sha || github.sha }}

    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - name: Verify target belongs to main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: Resolve version label
        id: label
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            labels=("$INPUT_VERSION_LABEL")
          else
            mapfile -t labels < <(jq -r '.[]' <<< "$PR_LABELS_JSON")
          fi

          selected_label=$(scripts/version-label.sh "${labels[@]}")
          echo "label=$selected_label" >> "$GITHUB_OUTPUT"
          echo "Selected version label: $selected_label"

      - name: Calculate release version
        id: version
        env:
          VERSION_LABEL: ${{ steps.label.outputs.label }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$VERSION_LABEL" == "version:none" ]]; then
            echo "current=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "existing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t target_tags < <(git tag --points-at "$TARGET_SHA")
          existing_version=$(scripts/latest-calver.sh "${target_tags[@]}")

          if [[ -n "$INPUT_CURRENT_VERSION" ]]; then
            current_version=$INPUT_CURRENT_VERSION
          else
            parent_sha=$(git rev-parse "$TARGET_SHA^")
            mapfile -t previous_tags < <(git tag --merged "$parent_sha")
            current_version=$(scripts/latest-calver.sh "${previous_tags[@]}")
          fi

          next_version=$(scripts/next-calver.sh "$VERSION_LABEL" "$current_version")

          if [[ -n "$existing_version" && "$existing_version" != "$next_version" ]]; then
            echo "Target already has unexpected release tag $existing_version" >&2
            exit 1
          fi

          echo "current=$current_version" >> "$GITHUB_OUTPUT"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          if [[ -n "$existing_version" ]]; then
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report release plan
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.current }}
          NEXT_VERSION: ${{ steps.version.outputs.version }}
          VERSION_LABEL: ${{ steps.label.outputs.label }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### Release plan"
            echo
            echo "- Label: \`$VERSION_LABEL\`"
            echo "- Target: \`$TARGET_SHA\`"
            echo "- Current version: \`${CURRENT_VERSION:-none}\`"
            echo "- Next version: \`${NEXT_VERSION:-none}\`"
            echo "- Dry-run: \`$DRY_RUN\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create annotated tag
        if: env.DRY_RUN != 'true' && steps.version.outputs.version != '' && steps.version.outputs.existing != 'true'
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse --verify --quiet "refs/tags/$NEXT_VERSION"; then
            echo "Release tag already exists: $NEXT_VERSION" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_VERSION" "$TARGET_SHA" -m "Release $NEXT_VERSION"
          git push origin "refs/tags/$NEXT_VERSION"

      - name: Publish GitHub Release
        if: env.DRY_RUN != 'true' && steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$NEXT_VERSION" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $NEXT_VERSION"
            exit 0
          fi

          gh release create "$NEXT_VERSION" \
            --generate-notes \
            --target "$TARGET_SHA" \
            --title "$NEXT_VERSION" \
            --verify-tag
