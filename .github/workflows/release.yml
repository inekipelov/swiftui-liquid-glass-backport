name: Release

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

env:
  INITIAL_VERSION: 26.0.0

jobs:
  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve current release
        id: current
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags
          mapfile -t release_tags < <(git tag --merged origin/main)
          current_version=$(scripts/latest-calver.sh "${release_tags[@]}")
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "Current release: ${current_version:-none}"

      - name: Reconcile GitHub Releases
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t release_tags < <(git tag --merged origin/main)
          for tag in "${release_tags[@]}"; do
            if [[ ! "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              continue
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              continue
            fi

            target_sha=$(git rev-list -n 1 "$tag")
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Missing GitHub Release: $tag at $target_sha"
              continue
            fi

            gh release create "$tag" \
              --generate-notes \
              --target "$target_sha" \
              --title "$tag" \
              --verify-tag
          done

      - name: Collect unreleased pull requests
        id: candidates
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          candidates_file="$RUNNER_TEMP/release-candidates.tsv"
          plan_file="$RUNNER_TEMP/release-plan.tsv"
          : > "$candidates_file"

          if [[ -n "$CURRENT_VERSION" ]]; then
            revision_range="$CURRENT_VERSION..origin/main"
          else
            revision_range="origin/main"
          fi

          mapfile -t commits < <(git rev-list --first-parent --reverse "$revision_range")
          for target_sha in "${commits[@]}"; do
            pulls_json=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/commits/$target_sha/pulls")
            pull_request=$(jq \
              --arg sha "$target_sha" \
              '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | first // empty' \
              <<< "$pulls_json")

            if [[ -z "$pull_request" ]]; then
              continue
            fi

            mapfile -t labels < <(jq -r '.labels[].name' <<< "$pull_request")
            selected_label=$(scripts/version-label.sh "${labels[@]}")
            printf '%s\t%s\n' "$target_sha" "$selected_label" >> "$candidates_file"
          done

          scripts/plan-calver.sh "$CURRENT_VERSION" < "$candidates_file" > "$plan_file"
          echo "plan_file=$plan_file" >> "$GITHUB_OUTPUT"

      - name: Report release plan
        env:
          PLAN_FILE: ${{ steps.candidates.outputs.plan_file }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### Release plan"
            echo
            echo "- Dry-run: \`$DRY_RUN\`"
            if [[ ! -s "$PLAN_FILE" ]]; then
              echo "- No release-bearing pull requests found."
            else
              while IFS=$'\t' read -r target_sha version_label next_version; do
                echo "- \`$next_version\` from \`$target_sha\` ($version_label)"
              done < "$PLAN_FILE"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish planned releases
        if: env.DRY_RUN != 'true'
        env:
          PLAN_FILE: ${{ steps.candidates.outputs.plan_file }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS=$'\t' read -r target_sha version_label next_version; do
            echo "Publishing $next_version from $target_sha ($version_label)"

            if git rev-parse --verify --quiet "refs/tags/$next_version"; then
              echo "Release tag already exists: $next_version" >&2
              exit 1
            fi

            git tag -a "$next_version" "$target_sha" -m "Release $next_version"
            git push origin "refs/tags/$next_version"
            gh release create "$next_version" \
              --generate-notes \
              --target "$target_sha" \
              --title "$next_version" \
              --verify-tag
          done < "$PLAN_FILE"
